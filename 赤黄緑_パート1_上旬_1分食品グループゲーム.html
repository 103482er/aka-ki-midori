<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔴🟡🟢 ３色栄養タイムアタック！！</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:linear-gradient(180deg,#fffdf4,#f5f7ff);color:#333;display:flex;justify-content:center;align-items:center}.app{width:min(94vw,760px);min-height:620px;padding:28px 24px 24px;background:rgba(255,255,255,.97);border-radius:28px;box-shadow:0 12px 36px rgba(0,0,0,.12);text-align:center}h1{margin:4px 0;font-size:clamp(27px,5vw,42px);line-height:1.2;font-weight:900}.part{margin:0 0 20px;font-size:clamp(20px,4vw,28px);font-weight:800}.lead{font-size:18px;line-height:1.8;margin:16px auto 24px}.rule{display:inline-block;text-align:left;background:#f7f7f7;border-radius:18px;padding:16px 20px;margin-bottom:26px;font-size:16px;line-height:1.8}button{font-family:inherit}.start-btn,.again-btn{border:0;border-radius:999px;padding:15px 34px;font-size:22px;font-weight:800;cursor:pointer;background:#333;color:white;box-shadow:0 5px 0 #111}.start-btn:active,.again-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #111}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 auto 18px;max-width:620px;font-weight:800;font-size:20px}.timer,.score{border-radius:999px;padding:8px 18px}.timer{background:#fff0f0}.score{background:#f4f4f4}.food-card{min-height:210px;display:flex;justify-content:center;align-items:center;margin:10px auto 20px;max-width:620px;border-radius:26px;background:#fff;border:3px solid #eee}#food{font-size:clamp(30px,7vw,54px);font-weight:900;padding:20px;word-break:keep-all}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;margin:0 auto}.answer{border:0;border-radius:20px;min-height:110px;padding:14px 8px;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}.answer small{display:block;font-size:12px;line-height:1.35;margin-top:7px;font-weight:700}.red{background:#ffb6b6}.yellow{background:#ffe59a}.green{background:#b9e8b9}.answer:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}.feedback{min-height:42px;font-size:25px;font-weight:900;margin:8px 0 0}.result-title{font-size:34px;font-weight:900;margin:10px 0 18px}.result-score{font-size:28px;font-weight:900;margin:12px 0}.result-detail{font-size:18px;line-height:1.8;margin:12px 0 22px}.menu-link-box{margin:24px auto 28px;max-width:600px}.bubble{display:inline-block;position:relative;background:#fff7c9;border-radius:18px;padding:11px 18px;margin-bottom:18px;font-size:18px;font-weight:800}.bubble:after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border-width:11px 10px 0;border-style:solid;border-color:#fff7c9 transparent transparent}.menu-link{display:inline-block;margin-top:2px;color:#1769aa;font-weight:800;text-decoration:underline;font-size:17px}.hidden{display:none!important}@media(max-width:560px){.app{min-height:100vh;border-radius:0;padding:24px 14px}.buttons{gap:8px}.answer{min-height:100px;font-size:19px}.answer small{font-size:10px}.food-card{min-height:180px}}</style></head><body><div class="app"><section id="startScreen"><h1>🔴🟡🟢 ３色栄養タイムアタック！！</h1><div class="part">パート１（１～１０日）</div><p class="lead">食品を見て、赤・黄・緑のどれかを選ぼう！<br>１分間で何問正解できるかな？</p><div class="rule"><div>🔴 <b>赤</b>：血・肉・ほねになり、からだをつくるもの</div><div>🟡 <b>黄</b>：ねつや力のもとになるもの</div><div>🟢 <b>緑</b>：からだの調子をととのえるもの</div></div><br><button class="start-btn" onclick="startGame()">ゲームスタート！</button></section><section id="gameScreen" class="hidden"><div class="topbar"><div class="timer">⏱ <span id="time">60</span>秒</div><div class="score">⭐ 正解 <span id="score">0</span>問</div></div><div class="food-card"><div id="food">食品</div></div><div id="feedback" class="feedback"></div><div class="buttons"><button class="answer red" onclick="answer('赤')">🔴 赤<small>からだをつくる</small></button><button class="answer yellow" onclick="answer('黄')">🟡 黄<small>ねつ・力のもと</small></button><button class="answer green" onclick="answer('緑')">🟢 緑<small>調子をととのえる</small></button></div></section><section id="resultScreen" class="hidden"><div class="result-title">🎉 タイムアップ！</div><div class="result-score">正解は <span id="finalScore">0</span> 問！</div><div class="result-detail"><div>答えた数：<span id="answered">0</span>問</div><div>正答率：<span id="accuracy">0</span>%</div></div><div class="menu-link-box"><div class="bubble">答えを確認してみよう！</div><br><a class="menu-link" href="https://www.city.kakogawa.lg.jp/material/files/group/79/R8-10B-3.pdf" target="_blank" rel="noopener">📖 １０月の給食献立表を見る</a></div><button class="again-btn" onclick="resetGame()">もう一度チャレンジ！</button></section></div><script>const foods=[{"name": "あつあげ", "group": "赤"}, {"name": "あぶらあげ", "group": "赤"}, {"name": "うずらたまご", "group": "赤"}, {"name": "かいそうミックス", "group": "赤"}, {"name": "カツオカツ", "group": "赤"}, {"name": "なまクリーム", "group": "赤"}, {"name": "しろいんげん", "group": "赤"}, {"name": "だいず（みずに）", "group": "赤"}, {"name": "ごはん", "group": "黄"}, {"name": "ちくわ", "group": "赤"}, {"name": "とうふ", "group": "赤"}, {"name": "とりにく", "group": "赤"}, {"name": "とりひきにく", "group": "赤"}, {"name": "ぶたにく", "group": "赤"}, {"name": "ぶたひきにく", "group": "赤"}, {"name": "ぎゅうにゅう", "group": "赤"}, {"name": "まぐろ（あぶらづけ）", "group": "赤"}, {"name": "チーズ", "group": "赤"}, {"name": "ベーコン", "group": "赤"}, {"name": "ミニウインナー", "group": "赤"}, {"name": "さわら", "group": "赤"}, {"name": "パン", "group": "黄"}, {"name": "あげあぶら", "group": "黄"}, {"name": "あぶら", "group": "黄"}, {"name": "きょうかまい", "group": "黄"}, {"name": "くろざとう", "group": "黄"}, {"name": "こむぎこ", "group": "黄"}, {"name": "ごま", "group": "黄"}, {"name": "ごまあぶら", "group": "黄"}, {"name": "さつまいも", "group": "黄"}, {"name": "さとう", "group": "黄"}, {"name": "じゃがいも", "group": "黄"}, {"name": "じょうしんこ", "group": "黄"}, {"name": "とうもろこしでんぷん", "group": "黄"}, {"name": "ひっつみ", "group": "黄"}, {"name": "ベシャメルソース", "group": "黄"}, {"name": "ワンタン", "group": "黄"}, {"name": "えのきたけ", "group": "緑"}, {"name": "こまつな", "group": "緑"}, {"name": "ごぼう", "group": "緑"}, {"name": "さやいんげん", "group": "緑"}, {"name": "しめじ", "group": "緑"}, {"name": "しょうが", "group": "緑"}, {"name": "しろねぎ", "group": "緑"}, {"name": "たまねぎ", "group": "緑"}, {"name": "だいこん", "group": "緑"}, {"name": "とうもろこし", "group": "緑"}, {"name": "なめしのもと", "group": "緑"}, {"name": "にんじん", "group": "緑"}, {"name": "にんにく", "group": "緑"}, {"name": "ねぎ", "group": "緑"}, {"name": "はくさい", "group": "緑"}, {"name": "ほししいたけ", "group": "緑"}, {"name": "まいたけ", "group": "緑"}, {"name": "もやし", "group": "緑"}, {"name": "れんこん", "group": "緑"}, {"name": "エリンギ", "group": "緑"}, {"name": "キャベツ", "group": "緑"}, {"name": "グリンピース", "group": "緑"}, {"name": "セロリ", "group": "緑"}, {"name": "チンゲンサイ", "group": "緑"}, {"name": "トマトピューレ", "group": "緑"}, {"name": "トマト（みずに）", "group": "緑"}, {"name": "レモンかじゅう", "group": "緑"}, {"name": "レンズまめおおむぎこむぎミックス", "group": "黄"}];let gameFoods=[],current=null,score=0,answered=0,timeLeft=60,timerId=null,locked=false;function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startGame(){document.getElementById('startScreen').classList.add('hidden');document.getElementById('resultScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');score=0;answered=0;timeLeft=60;locked=false;gameFoods=shuffle(foods);document.getElementById('score').textContent='0';document.getElementById('time').textContent='60';document.getElementById('feedback').textContent='';nextFood();clearInterval(timerId);timerId=setInterval(()=>{timeLeft--;document.getElementById('time').textContent=timeLeft;if(timeLeft<=0)endGame()},1000)}function nextFood(){if(!gameFoods.length)gameFoods=shuffle(foods);current=gameFoods.pop();document.getElementById('food').textContent=current.name}function answer(group){if(locked||timeLeft<=0)return;locked=true;answered++;let fb=document.getElementById('feedback');if(group===current.group){score++;fb.textContent='せいかい！'}else fb.textContent='ざんねん！';document.getElementById('score').textContent=score;setTimeout(()=>{fb.textContent='';locked=false;if(timeLeft>0)nextFood()},400)}function endGame(){clearInterval(timerId);timerId=null;locked=true;document.getElementById('gameScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');document.getElementById('finalScore').textContent=score;document.getElementById('answered').textContent=answered;document.getElementById('accuracy').textContent=answered?Math.round(score/answered*100):0}function resetGame(){document.getElementById('resultScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')} </script></body></html>
